<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ankita</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">Ankita<span>.</span></a>
        <button class="menu-btn" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a class="active" href="{% url 'contact' %}">Contact</a>
        </div>
    </nav>

    <main class="inner-page contact-page">
        <header class="page-heading">
            <p class="eyebrow">Say hello</p>
            <h1>Contact <span>Me</span></h1>
        </header>
        <form class="contact-form" id="contactForm">
            <div class="form-row">
                <label>
                    Your name
                    <input type="text" name="name" placeholder="Enter your name" required>
                </label>
                <label>
                    Email address
                    <input type="email" name="email" placeholder="name@example.com" required>
                </label>
            </div>
            <label>
                Your message
                <textarea name="message" rows="6" placeholder="How can I help you?" required></textarea>
            </label>
            <button class="btn primary" type="submit">Send Message</button>
            <p class="form-status" id="formStatus" role="status"></p>
        </form>
    </main>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
