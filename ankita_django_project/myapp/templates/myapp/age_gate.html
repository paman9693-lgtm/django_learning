<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification | Ankita</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="age-gate-page">
    <main class="age-gate-card">
        <p class="eyebrow">Age verification</p>
        <h1>Are you <span>18 or older?</span></h1>
        <p class="age-gate-copy">Please enter your age to continue to this website.</p>
        <form method="post" class="age-gate-form">
            {% csrf_token %}
            <label for="age">Your age</label>
            <input id="age" name="age" type="number" min="18" max="120" required
                   placeholder="Enter your age" autofocus>
            {% if error_message %}
                <p class="age-gate-error" role="alert">{{ error_message }}</p>
                <script>alert("You must be 18 or older to enter this website.");</script>
            {% endif %}
            <button class="btn primary" type="submit">Continue</button>
        </form>
    </main>
</body>
</html>
